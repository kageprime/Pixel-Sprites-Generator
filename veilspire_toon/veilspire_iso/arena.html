<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veilspire Arena — movement &amp; moves lab</title>
<style>
  :root{--bg:#0d0b14;--panel:#161221;--panel2:#1c1629;--line:#2c2340;
    --txt:#e8e2f4;--dim:#a79dc4;--acc:#b78cff;--acc2:#7ce7ff;--good:#8fe3a8;--bad:#ff8f8f}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#241b3d 0%,var(--bg) 60%) fixed,var(--bg);
    color:var(--txt);font:14px/1.45 system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
    background:rgba(13,11,20,.85);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;letter-spacing:.06em}
  header h1 b{color:var(--acc)}
  header .sub{color:var(--dim);font-size:12px}
  select{background:#1a1428;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}
  .btn{background:#241d38;border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:6px 10px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--acc)}
  .btn.on{background:var(--acc);border-color:var(--acc);color:#14101f;font-weight:700}
  .btn:disabled{opacity:.35;cursor:default}
  a.btn{text-decoration:none;display:inline-block}
  main{max-width:1060px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:12px;padding:10px}
  #stageBox{position:relative}
  canvas#cv{width:100%;display:block;border-radius:10px;border:1px solid var(--line);background:#0a0d16}
  #combo{position:absolute;right:12px;top:10px;text-align:right;pointer-events:none;
    font-weight:800;font-size:22px;color:var(--acc2);text-shadow:0 2px 8px #000}
  #combo small{display:block;font-size:12px;color:var(--dim);font-weight:400}
  .moves{display:flex;gap:6px;flex-wrap:wrap}
  .moves .btn b{color:var(--acc2)}
  .moves .btn.on b{color:#14101f}
  .keys{font-size:12px;color:var(--dim)}
  .keys kbd{background:#241d38;border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11px}
  #load{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>VEILSPIRE <b>ARENA</b></h1>
  <span class="sub">walk around · test every move on the dummy</span>
  <label style="font-size:12px;color:var(--dim)">you
    <select id="selP"></select></label>
  <label style="font-size:12px;color:var(--dim)">dummy
    <select id="selD"></select></label>
  <button class="btn" id="bGuard">dummy guards</button>
  <button class="btn" id="bReset">reset (R)</button>
  <a class="btn" href="studio.html">🖼 studio</a>
  <span class="sub" id="load">loading…</span>
</header>
<main>
  <section class="card" id="stageBox">
    <canvas id="cv" width="960" height="600"></canvas>
    <div id="combo"></div>
  </section>
  <section class="card">
    <div class="moves" id="moveBar"></div>
    <p class="keys" style="margin:8px 0 0">
      <kbd>WASD</kbd>/<kbd>←↑↓→</kbd> move · <kbd>space</kbd> jump · <kbd>J</kbd> attack chain (→ <kbd>J</kbd> <kbd>J</kbd>) ·
      <kbd>K</kbd> launcher / plunge in air · <kbd>shift</kbd> dash · hold <kbd>L</kbd> guard ·
      <kbd>Q</kbd>/<kbd>E</kbd> rotate camera · wheel zoom · <kbd>R</kbd> reset</p>
  </section>
</main>
<script>
"use strict";
/* sheet convention (same as the shipped engine): 6 cols x 8 rows,
   row order E SE S SW W NW N NE, hi-res toon cells drawn at half size */
const DIRS=["E","SE","S","SW","W","NW","N","NE"];
const CHARS=[
 {id:"ren_calder",name:"Ren Calder",weapon:"twinblades"},
 {id:"sera_quill",name:"Sera Quill",weapon:"staff"},
 {id:"kade_morr",name:"Kade Morr",weapon:"dagger"},
 {id:"bram_holt",name:"Bram Holt",weapon:"maul"},
 {id:"nyx_lumen",name:"Nyx Lumen",weapon:"lantern"},
 {id:"orin_vale",name:"Orin Vale",weapon:"spear"},
 {id:"mairen_solas",name:"Mairen Solas",weapon:"staff"},
 {id:"irix_venn",name:"Irix Venn",weapon:"saber"},
 {id:"juno_rake",name:"Juno Rake",weapon:"staff"},
 {id:"cinder",name:"Cinder",weapon:"longsword"},
 {id:"the_carapace",name:"The Carapace",weapon:"gauntlets"},
 {id:"floor_voice",name:"Floor Voice",weapon:"tablet"}];
const WEAPON_SKILLS={maul:["slam","sweep","bash"],spear:["thrust","sweep","whirl"],
 longsword:["slash","thrust","whirl"],saber:["thrust","slash","flurry"],
 twinblades:["slash","flurry","whirl"],dagger:["flurry","slash","thrust"],
 staff:["cast","pulse","sweep"],lantern:["cast","pulse","sweep"],tablet:["cast","pulse"],
 gauntlets:["flurry","slam","sweep"]};
const STYLE_NAME={slash:"Slash",thrust:"Thrust",slam:"Overhead slam",cast:"Cast",sweep:"Wide sweep",
 whirl:"Whirlwind",flurry:"Flurry",pulse:"Ground pulse",bash:"Shield bash",
 launcher:"Rising strike",air:"Air slash",plunge:"Plunge"};
const FPS={idle:6,walk:10,dash:16,jump:12,guard:12,attack1:14,attack2:14,attack3:14,
 launcher:14,air1:14,plunge:14,hit:12,hit_heavy:12,hit_back:12,block_hit:14,
 launch:14,tumble:12,knockdown:10,getup:8,death:8,victory:8};
const fps=a=>FPS[a]||12;
/* move data: lunge px/s, reach px, arc deg, damage, effect */
const CHAIN=[
 {slot:"attack1",lunge:170,reach:78,arc:70,dmg:45,hit:"hit",kb:170},
 {slot:"attack2",lunge:180,reach:78,arc:70,dmg:45,hit:"hit",kb:190},
 {slot:"attack3",lunge:220,reach:86,arc:80,dmg:80,hit:"hit_heavy",kb:320}];
const LAUNCHER={slot:"launcher",lunge:90,reach:72,arc:65,dmg:55,vz:430,kb:120};
const AIR={slot:"air1",lunge:120,reach:76,arc:75,dmg:45,pop:260,kb:140};
const PLUNGE={slot:"plunge",radius:70,dmg:130};
const HIT_FRAME=2, CANCEL_FRAME=3, CHAIN_END=6/FPS.attack1;

const cv=document.getElementById("cv"), g=cv.getContext("2d");
const W=cv.width, H=cv.height, CX=W/2, CY=H/2+40;
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const wrap=a=>((a%360)+360)%360, snap8=a=>wrap(Math.round(a/45)*45);
const angDiff=(a,b)=>Math.abs(((a-b+540)%360)-180);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);

/* ---------- sprites ---------- */
const cache={};   // "id/anim" -> {img,ok}
function need(id,anim){
  const k=id+"/"+anim;
  if(cache[k])return cache[k];
  const e=cache[k]={img:new Image(),ok:false};
  e.img.onload=()=>{e.ok=true;checkReady()};
  e.img.onerror=()=>{e.ok=false;checkReady()};
  e.img.src="OUT/"+id+"/"+anim+".png";
  return e;
}
const CORE=["idle","walk","dash","jump","guard","attack1","attack2","launcher","air1","plunge",
 "hit","hit_heavy","hit_back","block_hit","launch","tumble","knockdown","getup","death","victory"];
function skillsOf(id){return WEAPON_SKILLS[CHARS.find(c=>c.id===id).weapon]||["slash"]}
function preload(id){
  CORE.concat(["attack3"]).forEach(a=>need(id,a));
}
const SH={std:{img:new Image(),ok:false},large:{img:new Image(),ok:false}};
SH.std.img.onload=()=>SH.std.ok=true; SH.std.img.src="OUT/shadow_standard.png";
SH.large.img.onload=()=>SH.large.ok=true; SH.large.img.src="OUT/shadow_large.png";

/* ---------- state ---------- */
const P={cid:"ren_calder",x:-120,y:0,z:0,vx:0,vy:0,vz:0,face:0,anim:"idle",t:0,frame:null,
  mode:"ground",chain:0,didHit:false,queued:false,dashT:0,guard:false,dead:false,
  plungeHit:false,victoryT:0};
const D={cid:"cinder",x:110,y:20,z:0,vx:0,vy:0,vz:0,face:180,anim:"idle",t:0,frame:null,
  hp:1000,max:1000,mode:"idle",stun:0,guards:false,deadT:0};
const cam={ang:0,cur:0,zoom:1,shake:0,shx:0,shy:0};
let hitstop=0;
const combo={hits:0,dmg:0,t:0};
const parts=[],rings=[],nums=[];
const keys=new Set();
function availAttacks(){ // chain slots that exist on disk for this character
  const n=skillsOf(P.cid).length;
  return ["attack1","attack2","attack3"].slice(0,n);
}

/* ---------- camera / projection (2:1 dimetric, engine-style) ---------- */
function proj(x,y,z){
  const a=rad(cam.cur),c=Math.cos(a),s=Math.sin(a);
  const rx=x*c-y*s, ry=x*s+y*c, Z=cam.zoom;
  return [CX+Z*rx+cam.shx, CY+Z*(ry*.5-z)+cam.shy, Z];
}
const rowOf=face=>Math.round(wrap(face+cam.cur)/45)%8;
const depthOf=(x,y)=>{const a=rad(cam.cur);return x*Math.sin(a)+y*Math.cos(a)};
function drawEnt(e){
  const en=need(e.cid,e.anim);
  if(!en.ok)return;
  const img=en.img, C=img.width/6, k=C>=190?2:1, c=C/k, ax=c/2, ay=c>100?100:74;
  const loop=(e.anim==="idle"||e.anim==="walk"||e.anim==="tumble");
  const f=(e.frame===null||e.frame===undefined)
    ?(loop?Math.floor(e.t*fps(e.anim))%6:Math.min(5,Math.floor(e.t*fps(e.anim))))
    :e.frame;
  const [sx,sy,Z]=proj(e.x,e.y,e.z);
  const sh=e.cid==="the_carapace"?SH.large:SH.std; // same footprint rule as the shipped engine
  if(sh.ok){g.globalAlpha=.8;
    g.drawImage(sh.img,sx-ax*Z,sy-ay*Z,c*Z,c*Z);
    g.globalAlpha=1;}
  g.imageSmoothingEnabled=true;
  g.drawImage(img,f*C,rowOf(e.face)*C,C,C,Math.round(sx-ax*Z),Math.round(sy-ay*Z),c*Z,c*Z);
  g.imageSmoothingEnabled=false;
}

/* ---------- floor: neon dojo grid ---------- */
const ARENA=340;
function arenaClamp(e){
  const lim=ARENA;let hit=false;const u=e.x+e.y,v=e.y-e.x;
  if(u>lim){const d=u-lim;e.x-=d/2;e.y-=d/2;hit=true}
  else if(u<-lim){const d=u+lim;e.x-=d/2;e.y-=d/2;hit=true}
  if(v>lim){const d=v-lim;e.y-=d/2;e.x+=d/2;hit=true}
  else if(v<-lim){const d=v+lim;e.y-=d/2;e.x+=d/2;hit=true}
  if(hit){e.vx*=.3;e.vy*=.3}
}
function drawFloor(){
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,"#0a0d16");gr.addColorStop(.6,"#101423");gr.addColorStop(1,"#0b0e18");
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // tiles
  g.lineWidth=1;
  for(let i=-6;i<=6;i++){
    for(const kind of [0,1]){
      const a=kind?proj(i*64-ARENA,ARENA,0):proj(-ARENA,i*64-ARENA,0);
      const b=kind?proj(i*64+ARENA,-ARENA,0):proj(ARENA,i*64+ARENA,0);
      // clip segment to arena is skipped: faint lines are fine
      g.strokeStyle="rgba(124,231,255,.10)";
      g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
    }
  }
  // boundary diamond
  const cs=[proj(ARENA,0,0),proj(0,ARENA,0),proj(-ARENA,0,0),proj(0,-ARENA,0)];
  g.strokeStyle="rgba(183,140,255,.55)";g.lineWidth=2;
  g.beginPath();cs.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.stroke();
  // center ring
  const [ccx,ccy]=proj(0,0,0);
  g.strokeStyle="rgba(183,140,255,.30)";
  g.beginPath();g.ellipse(ccx,ccy,70*cam.zoom,35*cam.zoom,0,0,Math.PI*2);g.stroke();
}

/* ---------- fx ---------- */
function dust(x,y,n=6,sp=60){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2;
  parts.push({x,y,z:2,vx:Math.cos(a)*sp*(.4+Math.random()),vy:Math.sin(a)*sp*(.4+Math.random()),
  vz:40+Math.random()*60,life:0,max:.4+Math.random()*.3,col:"#aab2c4"})}}
function spark(x,y,z=50){for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2;
  parts.push({x,y,z,vx:Math.cos(a)*260,vy:Math.sin(a)*260,vz:120,life:0,max:.3,col:"#ffe9c0"})}}
function ring(x,y,r,col="#b78cff"){rings.push({x,y,r,t:0,dur:.45,col})}
function num(x,y,txt,col="#fff"){nums.push({x,y,txt,col,t:0})}
function stepFx(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=500*dt;p.vx*=.96;p.vy*=.96;
    if(p.life>=p.max||p.z<0)parts.splice(i,1)}
  for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>=rings[i].dur)rings.splice(i,1)}
  for(let i=nums.length-1;i>=0;i--){nums[i].t+=dt;if(nums[i].t>.9)nums.splice(i,1)}
  if(combo.t>0){combo.t-=dt;if(combo.t<=0){combo.hits=0;combo.dmg=0}}
}
function drawFx(){
  for(const r of rings){const u=r.t/r.dur,[x,y]=proj(r.x,r.y,0);
    g.globalAlpha=(1-u)*.8;g.strokeStyle=r.col;g.lineWidth=3;
    g.beginPath();g.ellipse(x,y,r.r*(1+u)*cam.zoom,r.r*(1+u)*cam.zoom*.5,0,0,Math.PI*2);g.stroke()}
  g.globalAlpha=1;
  for(const p of parts){const [x,y]=proj(p.x,p.y,p.z),u=p.life/p.max;
    g.globalAlpha=1-u;g.fillStyle=p.col;g.fillRect(x-1.5,y-1.5,3,3)}
  g.globalAlpha=1;
  g.textAlign="center";g.font="bold 15px system-ui";
  for(const n of nums){const [x,y]=proj(n.x,n.y,70-n.t*50);
    g.globalAlpha=1-n.t/0.9;g.fillStyle=n.col;g.fillText(n.txt,x,y)}
  g.globalAlpha=1;g.textAlign="left";
}

/* ---------- combat ---------- */
function tryHit(mv){
  const dx=D.x-P.x,dy=D.y-P.y,dist=Math.hypot(dx,dy);
  if(D.mode==="dead")return;
  if(dist>mv.reach||angDiff(deg(Math.atan2(dy,dx)),P.face)>mv.arc)return;
  // connected!
  if(D.guards&&mv.slot!=="plunge"){
    D.anim="block_hit";D.t=0;D.mode="stun";D.stun=.35;
    D.face=snap8(deg(Math.atan2(P.y-D.y,P.x-D.x)));
    const dvx=Math.cos(rad(P.face)),dvy=Math.sin(rad(P.face));
    D.vx=dvx*80;D.vy=dvy*80;spark(D.x,D.y);num(D.x,D.y-10,"guard","#7ce7ff");
    hitstop=3;return;
  }
  D.hp-=mv.dmg;combo.hits++;combo.dmg+=mv.dmg;combo.t=2;
  const dvx=Math.cos(rad(P.face)),dvy=Math.sin(rad(P.face));
  spark(D.x,D.y);num(D.x,D.y-10,mv.dmg,"#ffd66e");
  if(mv.slot==="launcher"||mv.vz){
    D.mode="air";D.anim="launch";D.t=0;D.vz=mv.vz||430;
    D.vx=dvx*(mv.kb||120);D.vy=dvy*(mv.kb||120);
    ring(D.x,D.y,40);cam.shake=5;hitstop=4;
  }else if(mv.slot==="plunge"){
    D.mode="down";D.anim="knockdown";D.t=0;D.stun=1.2;
    D.vx=dvx*200;D.vy=dvy*200;ring(D.x,D.y,60,"#ff9d5c");cam.shake=8;hitstop=5;
  }else if(mv.slot==="air1"&&D.mode==="air"){
    D.vz=Math.max(D.vz,mv.pop);D.anim="tumble";D.t=0;
    D.vx=dvx*mv.kb;D.vy=dvy*mv.kb;hitstop=3;
  }else{
    D.mode="stun";D.anim=mv.hit;D.t=0;D.stun=.45;
    D.face=snap8(deg(Math.atan2(P.y-D.y,P.x-D.x)));
    D.vx=dvx*mv.kb;D.vy=dvy*mv.kb;hitstop=mv.hit==="hit_heavy"?5:3;
    if(mv.hit==="hit_heavy")cam.shake=4;
  }
  if(D.hp<=0&&D.mode!=="dead"){
    D.mode="dead";D.anim="death";D.t=0;D.deadT=0;D.vx=D.vy=D.vz=0;D.z=0;
    P.mode="victory";P.anim="victory";P.t=0;ring(D.x,D.y,60,"#f5cd5a");
  }
}
function startChain(i){
  const mv=CHAIN[i];
  P.mode="attack";P.chain=i;P.anim=mv.slot;P.t=0;P.frame=null;P.didHit=false;P.queued=false;
  P.vx=Math.cos(rad(P.face))*mv.lunge;P.vy=Math.sin(rad(P.face))*mv.lunge;
}
function startLauncher(){
  P.mode="attack";P.chain=-1;P.anim="launcher";P.t=0;P.frame=null;P.didHit=false;P.queued=false;P.mv=LAUNCHER;
  P.vx=Math.cos(rad(P.face))*LAUNCHER.lunge;P.vy=Math.sin(rad(P.face))*LAUNCHER.lunge;
}
function startAir(){
  P.mode="attack";P.chain=-2;P.anim="air1";P.t=0;P.frame=null;P.didHit=false;P.queued=false;P.mv=AIR;
  P.vz=Math.max(P.vz,120);
}
function startPlunge(){
  if(P.mode!=="air")doJump();
  P.mode="attack";P.chain=-3;P.anim="plunge";P.t=0;P.frame=null;P.didHit=false;P.plungeHit=false;
  P.vz=Math.min(P.vz,-650);P.mv=PLUNGE;
}
function doJump(){
  if(P.mode!=="ground")return;
  P.mode="air";P.anim="jump";P.t=0;P.frame=null;P.vz=430;dust(P.x,P.y,5,50);
}
function doDash(){
  if(P.mode==="dash"||P.dead)return;
  const w=worldInput();let dx,dy;
  if(Math.hypot(w.x,w.y)>.2){const l=Math.hypot(w.x,w.y);dx=w.x/l;dy=w.y/l;
    P.face=snap8(deg(Math.atan2(dy,dx)))}
  else{dx=Math.cos(rad(P.face));dy=Math.sin(rad(P.face))}
  P.mode="dash";P.anim="dash";P.t=0;P.vx=dx*560;P.vy=dy*560;dust(P.x,P.y,8,80);
}
function doGuard(on){
  if(P.mode!=="ground"&&!(on===false&&P.mode==="guard"))return;
  P.guard=on;P.mode=on?"guard":"ground";P.anim=on?"guard":"idle";P.t=0;
  if(on)P.frame=3;
}

/* ---------- input ---------- */
function screenInput(){
  let x=0,y=0;
  if(keys.has("a")||keys.has("arrowleft"))x-=1;
  if(keys.has("d")||keys.has("arrowright"))x+=1;
  if(keys.has("w")||keys.has("arrowup"))y-=1;
  if(keys.has("s")||keys.has("arrowdown"))y+=1;
  const l=Math.hypot(x,y);return l>0?{x:x/l,y:y/l}:{x:0,y:0};
}
function worldInput(){ // camera-relative: un-rotate screen vec, unstretch y
  const s=screenInput(),a=rad(-cam.cur);
  const ux=s.x*Math.cos(a)-s.y*Math.sin(a), uy=s.x*Math.sin(a)+s.y*Math.cos(a);
  return {x:ux,y:uy/.5};
}
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k))e.preventDefault();
  if(e.repeat)return;
  keys.add(k);
  if(k===" ")doJump();
  if(k==="j"){
    if(P.mode==="ground")startChain(0);
    else if(P.mode==="air")startAir();
    else if(P.mode==="attack"&&P.chain>=0)P.queued=true;
  }
  if(k==="k"){
    if(P.mode==="ground")startLauncher();
    else if(P.mode==="air")startPlunge();
    else if(P.mode==="attack")P.queued=true;
  }
  if(k==="shift"||k==="v")doDash();
  if(k==="l"||k==="h")doGuard(true);
  if(k==="q")cam.ang-=45;
  if(k==="e")cam.ang+=45;
  if(k==="r")resetAll();
});
addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();keys.delete(k);
  if((k==="l"||k==="h")&&P.mode==="guard")doGuard(false);
});
cv.addEventListener("wheel",e=>{e.preventDefault();
  cam.zoom=clamp(cam.zoom*(e.deltaY>0?0.9:1.1),.5,2.2)},{passive:false});

/* ---------- update ---------- */
const SPEED=265;
function updatePlayer(dt){
  P.t+=dt;
  if(P.mode==="victory"){P.victoryT+=dt;P.vx=P.vy=0;
    if(P.victoryT>1.6){P.mode="ground";P.anim="idle";P.t=0;P.victoryT=0}return}
  if(P.mode==="guard"){P.frame=3;
    const w=worldInput(),l=Math.hypot(w.x,w.y);
    P.vx=l>0?w.x/l*SPEED*.3:0;P.vy=l>0?w.y/l*SPEED*.3:0;
    if(l>.2)P.face=snap8(deg(Math.atan2(w.y,w.x)));
    P.x+=P.vx*dt;P.y+=P.vy*dt;arenaClamp(P);return}
  if(P.mode==="dash"){
    P.x+=P.vx*dt;P.y+=P.vy*dt;P.vx*=.9;P.vy*=.9;arenaClamp(P);
    if(Math.random()<.5)dust(P.x,P.y,1,20);
    if(P.t>.22){P.mode=P.z>0?"air":"ground";P.anim=P.z>0?"jump":"idle";P.t=0}return}
  if(P.mode==="attack"){
    const mv=P.chain>=0?CHAIN[P.chain]:P.mv;
    const fr=Math.floor(P.t*fps(P.anim));
    P.x+=P.vx*dt;P.y+=P.vy*dt;P.vx*=.88;P.vy*=.88;arenaClamp(P);
    if(P.chain===-3){ // plunge: falling fast
      P.vz-=2600*dt;P.z+=P.vz*dt;
      if(P.z<=0){P.z=0;
        dust(P.x,P.y,14,140);ring(P.x,P.y,PLUNGE.radius,"#ff9d5c");cam.shake=8;hitstop=4;
        if(Math.hypot(D.x-P.x,D.y-P.y)<PLUNGE.radius+20&&D.mode!=="dead"){
          D.hp-=PLUNGE.dmg;combo.hits++;combo.dmg+=PLUNGE.dmg;combo.t=2;
          num(D.x,D.y-10,PLUNGE.dmg,"#ffd66e");spark(D.x,D.y);
          D.mode="down";D.anim="knockdown";D.t=0;D.stun=1.2;
          const a=deg(Math.atan2(D.y-P.y,D.x-P.x));
          D.vx=Math.cos(rad(a))*220;D.vy=Math.sin(rad(a))*220;
          if(D.hp<=0){D.mode="dead";D.anim="death";D.t=0;D.deadT=0;
            P.mode="victory";P.anim="victory";P.t=0;P.victoryT=0;return}
        }
        P.mode="ground";P.anim="idle";P.t=0}return}
    if(P.chain===-2){ // air slash: hover a touch
      P.vz-=900*dt;P.z+=P.vz*dt;
      if(P.z<=0){P.z=0;P.mode="ground";P.anim="idle";P.t=0;return}}
    if(!P.didHit&&fr>=HIT_FRAME&&P.chain!==-3){
      P.didHit=true;
      if(P.chain===-2)tryHit(AIR);else tryHit(mv);
    }
    const dur=CHAIN_END;
    if(P.queued&&fr>=CANCEL_FRAME){
      if(P.chain>=0&&P.chain<skillsOf(P.cid).length-1){startChain(P.chain+1);return}
      P.queued=false;
    }
    if(P.t>=dur){P.mode=P.z>0?"air":"ground";P.anim=P.z>0?"jump":"idle";P.t=0}return}
  // ground / air free
  const w=worldInput(),l=Math.hypot(w.x,w.y);
  if(P.mode==="ground"){
    const k=1-Math.exp(-12*dt);
    P.vx+=( (l>0?w.x/l*SPEED:0)-P.vx)*k;
    P.vy+=( (l>0?w.y/l*SPEED:0)-P.vy)*k;
    P.x+=P.vx*dt;P.y+=P.vy*dt;arenaClamp(P);
    if(l>.2){P.face=snap8(deg(Math.atan2(w.y,w.x)));P.anim="walk"}
    else P.anim="idle";
  }else if(P.mode==="air"){
    const k=1-Math.exp(-6*dt);
    P.vx+=((l>0?w.x/l*SPEED*.8:0)-P.vx)*k;
    P.vy+=((l>0?w.y/l*SPEED*.8:0)-P.vy)*k;
    P.x+=P.vx*dt;P.y+=P.vy*dt;P.vz-=1500*dt;P.z+=P.vz*dt;arenaClamp(P);
    if(l>.2&&P.anim==="jump")P.face=snap8(deg(Math.atan2(w.y,w.x)));
    if(P.z<=0){P.z=0;P.vz=0;P.mode="ground";P.anim="idle";P.t=0;dust(P.x,P.y,6,70)}
  }
}
function updateDummy(dt){
  D.t+=dt;
  if(D.mode==="dead"){D.deadT+=dt;
    if(D.deadT>2.5){D.hp=D.max;D.mode="idle";D.anim="idle";D.t=0;
      D.x=110;D.y=20;D.vx=D.vy=0;ring(D.x,D.y,40,"#8fe3a8")}return}
  if(D.mode==="air"){
    D.vz-=1100*dt;D.z+=D.vz*dt;D.x+=D.vx*dt;D.y+=D.vy*dt;arenaClamp(D);
    if(D.vz<0&&D.anim==="launch"){D.anim="tumble";D.t=0}
    if(D.z<=0){D.z=0;D.mode="down";D.anim="knockdown";D.t=0;D.stun=1;
      D.vx*=.3;D.vy*=.3;dust(D.x,D.y,8,90)}return}
  if(D.mode==="down"){
    D.x+=D.vx*dt;D.y+=D.vy*dt;D.vx*=.9;D.vy*=.9;arenaClamp(D);
    D.stun-=dt;
    if(D.stun<=0){D.mode="getup";D.anim="getup";D.t=0}return}
  if(D.mode==="getup"){
    if(D.t>=6/fps("getup")){D.mode="idle";D.anim="idle";D.t=0}return}
  if(D.mode==="stun"){
    D.x+=D.vx*dt;D.y+=D.vy*dt;D.vx*=.86;D.vy*=.86;arenaClamp(D);
    D.stun-=dt;
    if(D.stun<=0){D.mode="idle";D.anim="idle";D.t=0}return}
  // idle: face the player
  D.anim="idle";
  D.face=snap8(deg(Math.atan2(P.y-D.y,P.x-D.x)));
}
function resetAll(){
  Object.assign(P,{x:-120,y:0,z:0,vx:0,vy:0,vz:0,face:0,anim:"idle",t:0,frame:null,mode:"ground",
    chain:0,didHit:false,queued:false,guard:false,victoryT:0});
  Object.assign(D,{x:110,y:20,z:0,vx:0,vy:0,vz:0,face:180,anim:"idle",t:0,
    hp:1000,mode:"idle",stun:0,deadT:0});
  combo.hits=combo.dmg=0;combo.t=0;parts.length=rings.length=nums.length=0;
}

/* ---------- HUD ---------- */
function drawBar(x,y,w,frac,col){
  g.fillStyle="rgba(0,0,0,.55)";g.fillRect(x,y,w,12);
  g.fillStyle=col;g.fillRect(x+1,y+1,(w-2)*clamp(frac,0,1),10);
  g.strokeStyle="#2c2340";g.strokeRect(x+.5,y+.5,w-1,11);
}
function drawHUD(){
  // dummy plate
  const [dx,dy]=proj(D.x,D.y,D.z);
  g.font="12px system-ui";g.textAlign="left";
  const label=D.cid.replace(/_/g," ");
  const tw=Math.max(120,g.measureText(label).width+16);
  g.fillStyle="rgba(10,8,16,.7)";g.fillRect(dx-tw/2,dy-118,tw,30);
  g.fillStyle="#e8e2f4";g.fillText(label,dx-tw/2+8,dy-106);
  drawBar(dx-tw/2+8,dy-98,tw-16,D.hp/D.max,D.hp/D.max>.3?"#8fe3a8":"#ff8f8f");
  // player move state
  g.fillStyle="rgba(10,8,16,.7)";g.fillRect(10,H-30,300,20);
  g.fillStyle="#a79dc4";
  const atk=P.mode==="attack"?(P.chain>=0?CHAIN[P.chain].slot:P.anim):"—";
  g.fillText(`you: ${P.cid} · ${P.mode}${P.mode==="attack"?" · "+atk:""} · facing ${DIRS[rowOf(P.face)]}`,16,H-15);
  // combo
  const el=$("combo");
  el.innerHTML=combo.hits>1?`${combo.hits} hits<small>${combo.dmg} dmg</small>`:"";
}

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000);last=now;
  // camera ease (shortest path around the circle)
  let dd=wrap(cam.ang-cam.cur);if(dd>180)dd-=360;
  cam.cur=wrap(cam.cur+dd*Math.min(1,dt*8));
  if(hitstop>0){hitstop--;draw(dt);return}
  updatePlayer(dt);updateDummy(dt);stepFx(dt);
  cam.shake*=.88;cam.shx=(Math.random()-.5)*cam.shake;cam.shy=(Math.random()-.5)*cam.shake;
  draw(dt);
}
function draw(dt){
  g.clearRect(0,0,W,H);
  drawFloor();
  const order=[P,D].sort((a,b)=>depthOf(a.x,a.y)-depthOf(b.x,b.y));
  order.forEach(drawEnt);
  drawFx();drawHUD();
}

/* ---------- UI ---------- */
function buildUI(){
  const sp=$("selP"),sd=$("selD");
  CHARS.forEach(c=>{
    const o=document.createElement("option");o.value=c.id;
    o.textContent=`${c.name} (${c.weapon})`;sp.appendChild(o);
    const o2=document.createElement("option");o2.value=c.id;
    o2.textContent=`${c.name} (${c.weapon})`;sd.appendChild(o2);
  });
  sp.value=P.cid;sd.value=D.cid;
  sp.onchange=()=>{P.cid=sp.value;preload(P.cid);resetAll();refreshSkillButtons();syncHash()};
  sd.onchange=()=>{D.cid=sd.value;preload(D.cid);resetAll();syncHash()};
  $("bGuard").onclick=e=>{D.guards=!D.guards;
    e.target.classList.toggle("on",D.guards);
    e.target.textContent=D.guards?"dummy guards ✓":"dummy guards"};
  $("bReset").onclick=resetAll;
  const bar=$("moveBar");
  const mk=(label,fn,slot)=>{
    const b=document.createElement("button");b.className="btn";b.innerHTML=label;
    if(slot)b.dataset.slot=slot;
    b.onclick=fn;bar.appendChild(b);return b;
  };
  mk("<b>J</b> attack",()=>{if(P.mode==="ground")startChain(0);
    else if(P.mode==="air")startAir();else if(P.mode==="attack")P.queued=true});
  mk("<b>J×3</b> chain demo",()=>{
    if(P.mode!=="ground")return;startChain(0);
    setTimeout(()=>{if(P.mode==="attack")P.queued=true},260);
    setTimeout(()=>{if(P.mode==="attack")P.queued=true},520);
  });
  mk("<b>K</b> launcher",()=>{if(P.mode==="ground")startLauncher()});
  mk("<b>J</b> air slash",()=>{if(P.mode==="ground"){doJump();setTimeout(startAir,120)}else if(P.mode==="air")startAir()});
  mk("<b>K</b> plunge",()=>startPlunge());
  mk("<b>spc</b> jump",doJump);
  mk("<b>shf</b> dash",doDash);
  const gb=mk("hold <b>L</b> guard",()=>{});
  gb.onmousedown=()=>doGuard(true);gb.onmouseup=()=>doGuard(false);
  gb.onmouseleave=()=>{if(P.mode==="guard")doGuard(false)};
  refreshSkillButtons();
}
function refreshSkillButtons(){
  document.querySelectorAll("#moveBar [data-skill]").forEach(b=>b.remove());
  const bar=$("moveBar");
  skillsOf(P.cid).forEach((st,i)=>{
    const b=document.createElement("button");b.className="btn";b.dataset.skill=st;
    b.innerHTML=`<b>${i+1}</b> ${STYLE_NAME[st]}`;
    b.title="attack"+(i+1);
    b.onclick=()=>{if(P.mode==="ground")startChain(i)};
    bar.appendChild(b);
  });
}
function syncHash(){
  history.replaceState(null,"","#p="+P.cid+"&d="+D.cid);
}
function readHash(){
  const q=Object.fromEntries((location.hash||"").slice(1).split("&").map(s=>s.split("=")));
  if(q.p&&CHARS.some(c=>c.id===q.p))P.cid=q.p;
  if(q.d&&CHARS.some(c=>c.id===q.d))D.cid=q.d;
}
function checkReady(){
  const all=[P.cid,D.cid].every(id=>CORE.every(a=>{
    if(a==="attack3"&&skillsOf(id).length<3)return true;
    const e=cache[id+"/"+a];return e&&e.ok}));
  $("load").textContent=all?"ready — move with WASD, hit with J/K":"loading…";
}
/* per-frame anim label sync for skill buttons (attack anim already set) */
readHash();
buildUI();
$("selP").value=P.cid;$("selD").value=D.cid;
preload(P.cid);preload(D.cid);
resetAll();
requestAnimationFrame(frame);
</script>
</body>
