const DIRS=['E','SE','S','SW','W','NW','N','NE'],FPS={idle:6,walk:10,attack:14},NF=6,C=96,AX=48,AY=74,LIM=192,OX=240,OY=170,SPEED=70,HIT=3;
const cv=document.getElementById('c'),g=cv.getContext('2d'),hud=document.getElementById('hud');
g.imageSmoothingEnabled=false;
const IM={};let loaded=0;const names=Object.keys(DATA);
names.forEach(k=>{const i=new Image();i.onload=()=>loaded++;i.src=DATA[k];IM[k]=i});
const st={gx:0,gy:0,dir:2,anim:'idle',t:0};
let keys=new Set(),target=null,mode='walk',tAnim='walk',tt=0;
const set=a=>{if(st.anim!==a){st.anim=a;st.t=0}};
const K=k=>keys.has(k);

function diamond(cx,cy,fill,stroke){
  g.beginPath();g.moveTo(cx,cy-16);g.lineTo(cx+32,cy);g.lineTo(cx,cy+16);g.lineTo(cx-32,cy);g.closePath();
  g.fillStyle=fill;g.fill();g.strokeStyle=stroke;g.stroke();
}
function grid(){
  for(let i=-3;i<3;i++)for(let j=-3;j<3;j++){
    const cx=OX+(i-j)*32,cy=OY+(i+j+1)*16;
    diamond(cx,cy,(i+j)&1?'#22252e':'#282c37','#363a48');
  }
}
function spr(an,dir,f,x,y){
  g.drawImage(IM.shadow,x-AX,y-AY);
  g.drawImage(IM[an],f*C,dir*C,C,C,x-AX,y-AY,C,C);
}
function step(dt){
  if(st.anim==='attack')return;
  let vx=(K('d')||K('arrowright')?1:0)-(K('a')||K('arrowleft')?1:0),
      vy=(K('s')||K('arrowdown')?1:0)-(K('w')||K('arrowup')?1:0);
  if(vx||vy)target=null;
  else if(target){
    const dx=target.x-st.gx,dy=target.y-st.gy,d=Math.hypot(dx,dy);
    if(d<3)target=null;else{vx=dx/d;vy=dy/d}
  }
  const m=Math.hypot(vx,vy);
  if(!m){set('idle');return}
  vx/=m;vy/=m;
  st.dir=Math.round(((Math.atan2(vy,vx)*180/Math.PI+360)%360)/45)%8;
  const nx=st.gx+vx*SPEED*dt,ny=st.gy+vy*SPEED*dt;
  if(Math.abs(nx+ny)<=LIM&&Math.abs(ny-nx)<=LIM){st.gx=nx;st.gy=ny}else target=null;
  set('walk');
}
function attack(){if(mode==='walk'&&st.anim!=='attack'){set('attack');target=null}}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  requestAnimationFrame(frame);
  if(loaded<names.length)return;
  g.clearRect(0,0,cv.width,cv.height);
  if(mode==='walk'){
    step(dt);st.t+=dt;
    let f=Math.floor(st.t*FPS[st.anim]);
    if(st.anim==='attack'&&f>=NF){set('idle');f=0}
    f%=NF;
    grid();
    spr(st.anim,st.dir,f,OX+st.gx,OY+16+st.gy/2);
    hud.innerHTML='Facing <b>'+DIRS[st.dir]+'</b>, '+st.anim+', frame '+(f+1)+'/'+NF+(st.anim==='attack'&&f===HIT?' <b>(hit lands here)</b>':'');
  }else{
    tt+=dt;const f=Math.floor(tt*FPS[tAnim])%NF;
    g.font='11px system-ui,sans-serif';g.textAlign='center';
    for(let r=0;r<8;r++){
      const x=60+(r%4)*120,y=110+Math.floor(r/4)*170;
      diamond(x,y,'#22252e','#363a48');
      spr(tAnim,r,f,x,y);
      g.fillStyle='#9399a8';g.fillText(DIRS[r],x,y+38);
    }
    hud.innerHTML='All 8 rows of the <b>'+tAnim+'</b> sheet, frame '+(f+1)+'/'+NF+(tAnim==='attack'&&f===HIT?' <b>(hit lands here)</b>':'');
  }
}
requestAnimationFrame(frame);

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k===' '||k==='j'){e.preventDefault();attack();return}
  if('wasd'.includes(k)&&k.length===1||k.startsWith('arrow')){e.preventDefault();keys.add(k)}
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
cv.addEventListener('pointerdown',e=>{
  if(mode!=='walk')return;
  const r=cv.getBoundingClientRect(),sx=(e.clientX-r.left)*cv.width/r.width,sy=(e.clientY-r.top)*cv.height/r.height;
  target={x:sx-OX,y:(sy-OY-16)*2};
});
document.getElementById('atk').onclick=attack;
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;
  document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('an').hidden=mode!=='turn';
});
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
  tAnim=b.dataset.a;tt=0;
  document.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('on',x===b));
});
</script></body></html>
